builtin_models:
  - id: builtin-qwen-chat
    name: ${QWEN_MULTIMODAL_MODEL}
    type: KnowledgeQA
    source: local
    description: 默认 Qwen 多模态对话模型（远程 Ollama）
    is_default: true
    status: active
    parameters:
      base_url: ${OLLAMA_BASE_URL}
      interface_type: ollama
      supports_vision: true

  - id: builtin-qwen-vlm
    name: ${QWEN_MULTIMODAL_MODEL}
    type: VLLM
    source: local
    description: 默认 Qwen 视觉模型（远程 Ollama）
    is_default: true
    status: active
    parameters:
      base_url: ${OLLAMA_BASE_URL}
      interface_type: ollama
      supports_vision: true

  - id: builtin-qwen-embedding
    name: ${QWEN_EMBEDDING_MODEL}
    type: Embedding
    source: remote
    description: 默认 Qwen 文本向量模型
    is_default: true
    status: active
    parameters:
      base_url: ${QWEN_BASE_URL}
      api_key: ${QWEN_API_KEY}
      provider: aliyun
      embedding_parameters:
        dimension: 1024
        truncate_prompt_tokens: 0

  - id: builtin-qwen-rerank
    name: ${QWEN_RERANK_MODEL}
    type: Rerank
    source: remote
    description: Qwen Rerank 模型
    is_default: true
    status: active
    parameters:
      base_url: ${QWEN_RERANK_BASE_URL}
      api_key: ${QWEN_API_KEY}
      provider: aliyun
