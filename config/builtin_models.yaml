builtin_models:
  - id: builtin-qwen-chat
    name: ${QWEN_CHAT_MODEL}
    type: KnowledgeQA
    source: remote
    description: 默认 Qwen 对话模型（DashScope OpenAI 兼容模式）
    is_default: true
    status: active
    parameters:
      base_url: ${QWEN_BASE_URL}
      api_key: ${QWEN_API_KEY}
      provider: aliyun

  - id: builtin-qwen-embedding
    name: ${QWEN_EMBEDDING_MODEL}
    type: Embedding
    source: remote
    description: 默认 Qwen 文本向量模型
    is_default: true
    status: active
    parameters:
      base_url: ${QWEN_BASE_URL}
      api_key: ${QWEN_API_KEY}
      provider: aliyun
      embedding_parameters:
        dimension: 1024
        truncate_prompt_tokens: 0

  - id: builtin-qwen-rerank
    name: ${QWEN_RERANK_MODEL}
    type: Rerank
    source: remote
    description: Qwen Rerank 模型
    is_default: true
    status: active
    parameters:
      base_url: ${QWEN_RERANK_BASE_URL}
      api_key: ${QWEN_API_KEY}
      provider: aliyun

  - id: builtin-deepseek-chat
    name: ${DEEPSEEK_CHAT_MODEL}
    type: KnowledgeQA
    source: remote
    description: DeepSeek Chat 模型
    is_default: false
    status: active
    parameters:
      base_url: ${DEEPSEEK_BASE_URL}
      api_key: ${DEEPSEEK_API_KEY}
      provider: deepseek

  - id: builtin-deepseek-reasoner
    name: ${DEEPSEEK_REASONER_MODEL}
    type: KnowledgeQA
    source: remote
    description: DeepSeek Reasoner 模型
    is_default: false
    status: active
    parameters:
      base_url: ${DEEPSEEK_BASE_URL}
      api_key: ${DEEPSEEK_API_KEY}
      provider: deepseek