builtin_models:
  - id: builtin-qwen-chat
    name: ${QWEN_MULTIMODAL_MODEL}
    type: KnowledgeQA
    source: remote
    description: 默认 Qwen 多模态对话模型（OpenAI 兼容 vLLM）
    is_default: true
    status: active
    parameters:
      base_url: ${QWEN_MULTIMODAL_BASE_URL}
      interface_type: openai
      provider: generic
      supports_vision: true
      extra_config:
        thinking_control: chat_template_kwargs

  - id: builtin-qwen-vlm
    name: ${QWEN_MULTIMODAL_MODEL}
    type: VLLM
    source: remote
    description: 默认 Qwen 视觉模型（OpenAI 兼容 vLLM）
    is_default: true
    status: active
    parameters:
      base_url: ${QWEN_MULTIMODAL_BASE_URL}
      interface_type: openai
      provider: generic
      supports_vision: true
      extra_config:
        enable_thinking: "false"

  - id: builtin-qwen-embedding
    name: ${QWEN_EMBEDDING_MODEL}
    type: Embedding
    source: remote
    description: 默认 Qwen 文本向量模型
    is_default: true
    status: active
    parameters:
      base_url: ${QWEN_BASE_URL}
      api_key: ${QWEN_API_KEY}
      provider: aliyun
      embedding_parameters:
        dimension: 1024
        truncate_prompt_tokens: 0

  - id: builtin-qwen-rerank
    name: ${QWEN_RERANK_MODEL}
    type: Rerank
    source: remote
    description: Qwen Rerank 模型
    is_default: true
    status: active
    parameters:
      base_url: ${QWEN_RERANK_BASE_URL}
      api_key: ${QWEN_API_KEY}
      provider: aliyun
