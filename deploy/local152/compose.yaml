name: weknora
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  frontend:
    <<: *defaults
    image: weknora-ui:arm64-152
    container_name: WeKnora-frontend
    ports: ['192.168.18.152:9750:80']
    environment:
      MAX_FILE_SIZE_MB: '50'
      APP_HOST: 192.168.18.152
      APP_PORT: '9751'
      APP_SCHEME: http
    depends_on:
      app: {condition: service_healthy}
  app:
    <<: *defaults
    image: weknora-app:arm64-152
    container_name: WeKnora-app
    env_file: ../../.env
    ports: ['192.168.18.152:9751:8080']
    volumes:
      - ../../config/config.yaml:/app/config/config.yaml:ro
      - ../../config/builtin_models.yaml:/app/config/builtin_models.yaml:ro
      - ../../.weknora-deploy/runtime/files:/data/files
      - ../../.weknora-deploy/runtime/docreader-tmp:/tmp/docreader:ro
    depends_on:
      docreader: {condition: service_healthy}
      qdrant: {condition: service_started}
      neo4j: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
  docreader:
    <<: *defaults
    image: wechatopenai/weknora-docreader:v0.7.1
    container_name: WeKnora-docreader
    volumes:
      - ../../.weknora-deploy/runtime/docreader-tmp:/tmp/docreader
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ['CMD', '/bin/grpc_health_probe', '-addr=localhost:50051']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
  postgres:
    <<: *defaults
    image: postgres:17
    container_name: WeKnora-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ../../.weknora-deploy/runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'weknora_152', '-d', 'weknora_152']
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    <<: *defaults
    image: redis:7.0-alpine
    container_name: WeKnora-redis
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ../../.weknora-deploy/runtime/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
  minio:
    <<: *defaults
    image: local/minio152:RELEASE.2025-04-22T22-12-26Z-arm64
    container_name: WeKnora-minio
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '192.168.18.152:9753:9000'
      - '192.168.18.152:9754:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY}
    volumes:
      - ../../.weknora-deploy/runtime/minio:/data
  qdrant:
    <<: *defaults
    image: qdrant/qdrant:v1.16.2
    container_name: WeKnora-qdrant
    ports:
      - '192.168.18.152:9757:6333'
      - '192.168.18.152:9758:6334'
    volumes:
      - ../../.weknora-deploy/runtime/qdrant:/qdrant/storage
  neo4j:
    <<: *defaults
    image: neo4j:2025.10.1
    container_name: WeKnora-neo4j
    ports:
      - '192.168.18.152:9755:7474'
      - '192.168.18.152:9756:7687'
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_bolt_advertised__address: 192.168.18.152:9756
      NEO4J_server_http_advertised__address: 192.168.18.152:9755
    volumes:
      - ../../.weknora-deploy/runtime/neo4j:/data
  searxng:
    <<: *defaults
    image: searxng/searxng:latest
    container_name: WeKnora-searxng
    ports: ['192.168.18.152:9752:8080']
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://192.168.18.152:9752/
  mcp:
    <<: *defaults
    image: weknora-mcp:arm64-152
    container_name: WeKnora-mcp
    ports: ['192.168.18.152:9770:8000']
    env_file: ../../.env
    environment:
      WEKNORA_BASE_URL: http://192.168.18.152:9751/api/v1
    depends_on:
      app: {condition: service_healthy}
